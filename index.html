<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU Synthetic Intelligence</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:clamp(14px,5vw,22px);letter-spacing:clamp(.01em,.35vw,.1em);margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:13px}.back{display:inline-block;margin:0 16px 8px;color:var(--leaf);font-size:13px;text-underline-offset:3px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c100a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--leaf);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>SYNTHETIC INTELLIGENCE</span></h1><p class="sub">Nine steps. The reply is not a witness. This page does not call a model.</p><a class="back" href="https://splashdown1.github.io/tru-shelf/portal/">← Back to the TRU Portal</a></header>
<div class="warn">It will answer when it does not know. Tell it to say not packed. Then check the part you will use.</div>
<div class="bar"><input id="q" placeholder="step, source, save…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"1. Name the job",d:"Before you open the chat, write one sentence. What finished looks like. A pole length. A verse. A file. If you cannot name the job, you are not ready to ask."},
{t:"2. Name the source",d:"Say which book, manual, or page you will accept. \"From FM 21-76.\" \"From the KJV, and quote it.\" A wide ask with no source gets a wide invention."},
{t:"3. Allow the gap",d:"Add the line: if it is not in the source, say not packed. Do not fill it. A gap you can see is safer than a number it made up."},
{t:"4. Send one ask",d:"Job, source, gap. Then stop. Do not stack five jobs in one message. Example: Ford from FM 21-76. Pole length if the manual gives it. If it does not, say not packed."},
{t:"5. Send only what you would say in a room",d:"No password. No key. No private name. No confession. The chat is not your house. A file on the phone is."},
{t:"6. Read for the claim you will use",d:"Ignore the rest of the paragraph. Mark the date, the dose, the length, the verse. That is the only part that has to be true."},
{t:"7. Ask where it is printed",d:"If the claim matters, ask for the page or the verse. If it cannot point, drop the claim. Do not argue it into being true."},
{t:"8. Open the source",d:"Check the pointed place yourself, or do not use it. The model is not the witness. The book is. Lifeline, Water, and Canonbound exist so the checked part has a home."},
{t:"9. Save the checked part",d:"Paste what you verified into a file you can open with the radio off. Do not keep the thread as the record. TRU Code is the shape of the file. TRU Rack is why the file still works when the hall does not."},
{t:"Gap",d:"No model name. No hidden prompt. No way to make it ignore its limits. A trick is not a step."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">STEP</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">Use. Not a model manual.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented step.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
